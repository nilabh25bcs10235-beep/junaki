# Junaki — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# All packages required for `next build` live in dependencies so a
# production-only install still works. Lint tooling stays in devDependencies.
services:
  - type: web
    name: junaki
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
